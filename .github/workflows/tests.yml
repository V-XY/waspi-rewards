name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phpunit:
    name: Laravel tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run automated tests
        run: php artisan test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Report dependency vulnerabilities
        run: npm audit --json || true

      - name: Build frontend assets
        run: npm run build

      - name: Build Docker image
        run: docker build --tag waspi-rewards:ci .

      - name: Smoke test Docker container
        run: |
          docker run --detach --name waspi-rewards-smoke --publish 127.0.0.1:8080:80 waspi-rewards:ci

          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8080/up; then
              docker rm --force waspi-rewards-smoke
              exit 0
            fi

            sleep 2
          done

          docker logs waspi-rewards-smoke
          docker rm --force waspi-rewards-smoke
          exit 1
